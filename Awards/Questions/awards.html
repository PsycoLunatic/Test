    ];

    let currentSet = 0;
    let timerInterval;
    let timeLeft = 1500; // 25 mins in seconds
    let submitted = false;

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 1500;
        document.getElementById("timer").innerText = formatTime(timeLeft);
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitQuiz();
            } else {
                timeLeft--;
                document.getElementById("timer").innerText = formatTime(timeLeft);
            }
        }, 1000);
    }

    function loadSet(index) {
        currentSet = index;
        submitted = false;
        
        // Update Buttons
        const buttons = document.querySelectorAll("#set-buttons button");
        buttons.forEach((btn, i) => {
            if (i === index) btn.classList.add("active");
            else btn.classList.remove("active");
        });

        // Load Quiz
        const container = document.getElementById("quiz-container");
        container.innerHTML = "";
        
        const setQuestions = quizData[index];
        setQuestions.forEach((qObj, qIndex) => {
            let optionsHTML = "";
            qObj.options.forEach((opt, oIndex) => {
                optionsHTML += `
                    <li>
                        <label>
                            <input type="radio" name="q${qIndex}" value="${oIndex}">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            container.innerHTML += `
                <div class="question-card" id="card-${qIndex}">
                    <h3>Q${qIndex + 1}. ${qObj.q}</h3>
                    <ul class="options">
                        ${optionsHTML}
                    </ul>
                    <div class="explanation" id="exp-${qIndex}"></div>
                </div>
            `;
        });

        document.getElementById("result-box").style.display = "none";
        document.querySelector(".submit-btn").disabled = false;
        startTimer();
        window.scrollTo(0, 0);
    }

    function submitQuiz() {
        if (submitted) return;
        submitted = true;
        clearInterval(timerInterval);
        document.querySelector(".submit-btn").disabled = true;

        const setQuestions = quizData[currentSet];
        let score = 0;

        setQuestions.forEach((qObj, qIndex) => {
            const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
            const expDiv = document.getElementById(`exp-${qIndex}`);
            const cardDiv = document.getElementById(`card-${qIndex}`);
            
            expDiv.style.display = "block";
            
            if (selected && parseInt(selected.value) === qObj.a) {
                score++;
                expDiv.innerHTML = `<span class="correct-ans">Correct!</span> ${qObj.exp}`;
                cardDiv.style.borderLeft = "5px solid #5cb85c";
            } else {
                expDiv.innerHTML = `<span class="wrong-ans">Incorrect.</span> <strong>Correct Answer:</strong> ${qObj.options[qObj.a]}<br><br>${qObj.exp}`;
                cardDiv.style.borderLeft = "5px solid #d9534f";
            }
            
            // Disable all radios
            document.querySelectorAll(`input[name="q${qIndex}"]`).forEach(el => el.disabled = true);
        });

        const resBox = document.getElementById("result-box");
        resBox.style.display = "block";
        resBox.innerHTML = `You scored ${score} out of 25 in Set ${currentSet + 1}.`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetQuiz() {
        loadSet(currentSet);
    }

    // Initialize
    window.onload = () => loadSet(0);
</script>
