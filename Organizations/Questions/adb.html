<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated CBT - Asian Development Bank (ADB)</title>
    <style>
        :root {
            --gray: #e0e0e0;
            --red: #dc3545;
            --green: #28a745;
            --purple: #6f42c1;
            --blue: #007bff;
            --dark: #343a40;
            --light: #f8f9fa;
        }
        body, html {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%; background-color: var(--light); color: var(--dark);
        }
        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--dark); color: white; padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header-title { font-size: 1.2rem; font-weight: bold; }
        .timer-container { font-size: 1.3rem; font-weight: bold; padding: 5px 15px; border-radius: 5px; background: #222; }
        .timer-container.pulse { animation: pulseRed 1s infinite; color: var(--red); }
        @keyframes pulseRed { 0% { transform: scale(1); } 50% { transform: scale(1.05); text-shadow: 0 0 10px red; } 100% { transform: scale(1); } }

        /* Layout */
        #main-wrapper { display: flex; height: calc(100vh - 130px); }
        #left-panel { flex: 3; padding: 20px; overflow-y: auto; background: white; border-right: 2px solid var(--gray); }
        #right-panel { flex: 1; padding: 20px; overflow-y: auto; background: var(--light); display: flex; flex-direction: column; }

        /* Question Area */
        .question-number { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: var(--blue); }
        .question-text { font-size: 1.15rem; margin-bottom: 20px; line-height: 1.5; }
        .option-label {
            display: block; padding: 12px; margin-bottom: 10px; border: 1px solid var(--gray);
            border-radius: 5px; cursor: pointer; transition: 0.2s; background: white;
        }
        .option-label:hover { background: #f1f8ff; }
        .option-label input { margin-right: 10px; }

        /* Palette Area */
        .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .palette-btn {
            width: 45px; height: 45px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
            color: #333; background: var(--gray); transition: 0.2s; font-size: 1rem;
        }
        .palette-btn.active-q { border: 2px solid #000; transform: scale(1.1); box-shadow: 0 0 5px rgba(0,0,0,0.3); }

        .status-not-visited { background: var(--gray); color: #333; }
        .status-visited { background: var(--red); color: white; }
        .status-answered { background: var(--green); color: white; }
        .status-marked { background: var(--purple); color: white; }

        /* Legend */
        .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.9rem; margin-top: auto; padding-top: 20px; border-top: 1px solid var(--gray); }
        .legend-item { display: flex; align-items: center; width: 45%; }
        .legend-box { width: 20px; height: 20px; margin-right: 8px; border-radius: 3px; }

        /* Footer / Action Bar */
        footer {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: white; border-top: 2px solid var(--gray);
            height: 60px; box-sizing: border-box;
        }
        .btn-group { display: flex; gap: 10px; }
        button.action-btn {
            padding: 10px 20px; font-size: 1rem; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s;
        }
        .btn-prev, .btn-next { background: var(--blue); color: white; }
        .btn-prev:hover, .btn-next:hover { background: #0056b3; }
        .btn-clear { background: white; border: 1px solid var(--dark); color: var(--dark); }
        .btn-clear:hover { background: var(--gray); }
        .btn-mark { background: var(--purple); color: white; }
        .btn-mark:hover { background: #5a32a3; }
        .btn-submit { background: var(--green); color: white; font-size: 1.1rem; }
        .btn-submit:hover { background: #218838; }

        /* Results Screen */
        #result-screen { display: none; padding: 30px; max-width: 900px; margin: 0 auto; background: white; min-height: 100vh; }
        .summary-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0 30px 0; text-align: center;
        }
        .summary-card { padding: 20px; border-radius: 8px; font-weight: bold; color: white; }
        .sc-total { background: var(--blue); } .sc-correct { background: var(--green); }
        .sc-incorrect { background: var(--red); } .sc-unattempted { background: var(--gray); color: #333; }
        .summary-card span { display: block; font-size: 2rem; margin-top: 10px; }

        .review-card { border: 1px solid var(--gray); border-radius: 8px; padding: 15px; margin-bottom: 15px; background: var(--light); }
        .review-q { font-weight: bold; margin-bottom: 10px; }
        .review-status { font-weight: bold; margin-bottom: 10px; padding: 5px 10px; display: inline-block; border-radius: 3px; color: white;}
        .status-corr { background: var(--green); } .status-incorr { background: var(--red); } .status-unatt { background: var(--gray); color: #333; }
        .review-explanation { margin-top: 15px; padding: 10px; background: #e9ecef; border-left: 4px solid var(--blue); }
        .btn-retake { background: var(--blue); color: white; padding: 12px 25px; font-size: 1.1rem; border: none; border-radius: 5px; cursor: pointer; display: block; margin: 30px auto; }
    </style>
</head>
<body>

    <!-- QUIZ INTERFACE -->
    <div id="quiz-screen">
        <header>
            <div class="header-title">Automated CBT: Based on "New Text Document_6.txt"</div>
            <div id="timer" class="timer-container">10:00</div>
        </header>

        <div id="main-wrapper">
            <div id="left-panel">
                <div class="question-number" id="q-number">Question 1</div>
                <div class="question-text" id="q-text"></div>
                <div id="options-container"></div>
            </div>

            <div id="right-panel">
                <h3 style="margin-top: 0;">Navigation Palette</h3>
                <div class="palette-grid" id="palette"></div>

                <div class="legend">
                    <div class="legend-item"><div class="legend-box status-not-visited"></div> Not Visited</div>
                    <div class="legend-item"><div class="legend-box status-visited"></div> Not Answered</div>
                    <div class="legend-item"><div class="legend-box status-answered"></div> Answered</div>
                    <div class="legend-item"><div class="legend-box status-marked"></div> Marked for Review</div>
                </div>
            </div>
        </div>

        <footer>
            <div class="btn-group">
                <button class="action-btn btn-prev" onclick="nav(-1)">Previous</button>
                <button class="action-btn btn-next" onclick="nav(1)">Next</button>
            </div>
            <div class="btn-group">
                <button class="action-btn btn-clear" onclick="clearResponse()">Clear Response</button>
                <button class="action-btn btn-mark" onclick="toggleMark()">Mark for Review</button>
                <button class="action-btn btn-submit" onclick="submitTest()">Submit Test</button>
            </div>
        </footer>
    </div>

    <!-- RESULT INTERFACE -->
    <div id="result-screen">
        <h1 style="text-align: center;">Scorecard & Performance Review</h1>
        <div class="summary-grid">
            <div class="summary-card sc-total">Total Questions<span id="res-total">12</span></div>
            <div class="summary-card sc-correct">Correct<span id="res-correct">0</span></div>
            <div class="summary-card sc-incorrect">Incorrect<span id="res-incorrect">0</span></div>
            <div class="summary-card sc-unattempted">Unattempted<span id="res-unattempted">0</span></div>
        </div>

        <h2>Detailed Review</h2>
        <div id="review-container"></div>
        <button class="btn-retake" onclick="initTest()">Retake Test</button>
    </div>

    <script>
        const quizData = [
            {
                q: "When did the Asian Development Bank (ADB) officially open for operations?[cite: 6]",
                options: ["19 December 1963", "19 December 1966", "24 February 2025", "27 September 2024"],
                correct: 1,
                exp: "ADB officially opened in Manila on 19 December 1966 with 31 founding members[cite: 6]."
            },
            {
                q: "Where are the headquarters of the Asian Development Bank (ADB) located?[cite: 6]",
                options: ["Tokyo, Japan", "New Delhi, India", "Manila, Philippines", "Beijing, China"],
                correct: 2,
                exp: "ADB's headquarters are located in Mandaluyong City, Metro Manila, Philippines[cite: 6]."
            },
            {
                q: "As of the latest updates, what is the total number of ADB member countries and how are they categorized?[cite: 6]",
                options: ["69 members (50 regional, 19 nonregional)", "68 members (48 regional, 20 nonregional)", "69 members (40 regional, 29 nonregional)", "31 members (all regional)"],
                correct: 0,
                exp: "ADB currently has 69 members, which includes 50 regional members and 19 nonregional members[cite: 6]."
            },
            {
                q: "Which country joined the ADB on 27 September 2024 to become its 69th member?[cite: 6]",
                options: ["Iran", "Israel", "Saudi Arabia", "Turkey"],
                correct: 1,
                exp: "Israel joined ADB on 27 September 2024, becoming its 69th member[cite: 6]."
            },
            {
                q: "Who is the 11th President of the Asian Development Bank (ADB) that assumed office on 24 February 2025?[cite: 6]",
                options: ["Takeshi Watanabe", "Masatsugu Asakawa", "Masato Kanda", "Shinzō Abe"],
                correct: 2,
                exp: "Masato Kanda from Japan is the 11th President of ADB, having succeeded Masatsugu Asakawa[cite: 6]."
            },
            {
                q: "Which organ of the Asian Development Bank is considered its highest policy-making body?[cite: 6]",
                options: ["Board of Directors", "Board of Governors", "Office of the President", "Executive Committee"],
                correct: 1,
                exp: "The Board of Governors is the highest policy-making body of the ADB, with each member country having one Governor[cite: 6]."
            },
            {
                q: "The ADB Board of Directors oversees the general operations of the bank. How many Directors make up this board and how are they elected?[cite: 6]",
                options: ["12 Directors (8 from the Asia-Pacific region, 4 from outside)", "15 Directors (10 from the Asia-Pacific region, 5 from outside)", "12 Directors (all from the Asia-Pacific region)", "31 Directors (one for each founding member)"],
                correct: 0,
                exp: "The Board of Governors elects 12 Directors, of which 8 are elected from the Asia-Pacific region and 4 are elected from outside the region[cite: 6]."
            },
            {
                q: "What is India's historical membership status with the Asian Development Bank?[cite: 6]",
                options: ["India joined in 2024 as a nonregional member.", "India is not a member of the ADB.", "India joined in 1991 during its economic liberalization.", "India is a founding member that joined in 1966."],
                correct: 3,
                exp: "India is a founding member of ADB and joined the bank in 1966[cite: 6]."
            },
            {
                q: "Who served as the first President of the Asian Development Bank upon its establishment in 1966?[cite: 6]",
                options: ["Masato Kanda", "Masatsugu Asakawa", "Takeshi Watanabe", "Haruhiko Kuroda"],
                correct: 2,
                exp: "Takeshi Watanabe from Japan became the first President of ADB in 1966[cite: 6]."
            },
            {
                q: "Which of the following is one of ADB's most important economic publications that provides economic growth forecasts and regional analysis?[cite: 6]",
                options: ["World Economic Outlook", "Asian Development Outlook (ADO)", "Human Development Report", "Global Resources Outlook"],
                correct: 1,
                exp: "The Asian Development Outlook (ADO) is one of ADB's most important economic publications, providing economic growth forecasts, inflation outlooks, and regional analysis[cite: 6]."
            },
            {
                q: "The idea for the ADB was advanced by regional discussions under which UN body in the early 1960s?[cite: 6]",
                options: ["UN General Assembly (UNGA)", "UN Development Programme (UNDP)", "UN Economic Commission for Asia and the Far East (ECAFE)", "UN Environment Programme (UNEP)"],
                correct: 2,
                exp: "A 1963 ministerial conference convened by the UN Economic Commission for Asia and the Far East (ECAFE) helped set the process in motion for creating the ADB[cite: 6]."
            },
            {
                q: "For how long is the second term of ADB President Masato Kanda, which begins on 24 November 2026?[cite: 6]",
                options: ["Three years", "Four years", "Five years", "Six years"],
                correct: 2,
                exp: "In September 2026, Masato Kanda was reelected for a second five-year term, which begins on 24 November 2026[cite: 6]."
            }
        ];

        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let qStatus = new Array(quizData.length).fill('not-visited');
        let timerSeconds = 600;
        let timerInterval;

        function initTest() {
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            currentIndex = 0;
            userAnswers = new Array(quizData.length).fill(null);
            qStatus = new Array(quizData.length).fill('not-visited');
            timerSeconds = 600;
            document.getElementById('res-total').innerText = quizData.length;

            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            updateTimerDisplay();

            buildPalette();
            renderQuestion(0);
        }

        function updateTimer() {
            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                submitTest();
                return;
            }
            timerSeconds--;
            updateTimerDisplay();

            const timerEl = document.getElementById('timer');
            if (timerSeconds <= 120) {
                timerEl.classList.add('pulse');
            } else {
                timerEl.classList.remove('pulse');
            }
        }

        function updateTimerDisplay() {
            let m = Math.floor(timerSeconds / 60);
            let s = timerSeconds % 60;
            document.getElementById('timer').innerText =
                (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
        }

        function buildPalette() {
            const pal = document.getElementById('palette');
            pal.innerHTML = '';
            for (let i = 0; i < quizData.length; i++) {
                const btn = document.createElement('button');
                btn.className = `palette-btn status-${qStatus[i]}`;
                btn.innerText = i + 1;
                btn.onclick = () => renderQuestion(i);
                btn.id = `pal-btn-${i}`;
                pal.appendChild(btn);
            }
        }

        function updatePaletteStyles() {
            for (let i = 0; i < quizData.length; i++) {
                const btn = document.getElementById(`pal-btn-${i}`);
                btn.className = `palette-btn status-${qStatus[i]}`;
                if (i === currentIndex) btn.classList.add('active-q');
            }
        }

        function renderQuestion(index) {
            currentIndex = index;
            if (qStatus[currentIndex] === 'not-visited') {
                qStatus[currentIndex] = 'visited';
            }

            document.getElementById('q-number').innerText = `Question ${currentIndex + 1} of ${quizData.length}`;
            document.getElementById('q-text').innerHTML = quizData[currentIndex].q;

            const optCont = document.getElementById('options-container');
            optCont.innerHTML = '';

            quizData[currentIndex].options.forEach((opt, idx) => {
                const lbl = document.createElement('label');
                lbl.className = 'option-label';

                const inp = document.createElement('input');
                inp.type = 'radio';
                inp.name = 'q-option';
                inp.value = idx;
                if (userAnswers[currentIndex] === idx) inp.checked = true;

                inp.onchange = () => {
                    userAnswers[currentIndex] = idx;
                    if (qStatus[currentIndex] !== 'marked') {
                        qStatus[currentIndex] = 'answered';
                    }
                    updatePaletteStyles();
                };

                lbl.appendChild(inp);
                lbl.appendChild(document.createTextNode(opt));
                optCont.appendChild(lbl);
            });

            updatePaletteStyles();
        }

        function nav(step) {
            let next = currentIndex + step;
            if (next >= 0 && next < quizData.length) {
                renderQuestion(next);
            }
        }

        function clearResponse() {
            userAnswers[currentIndex] = null;
            const inps = document.getElementsByName('q-option');
            inps.forEach(i => i.checked = false);
            if (qStatus[currentIndex] !== 'marked') {
                qStatus[currentIndex] = 'visited';
            }
            updatePaletteStyles();
        }

        function toggleMark() {
            if (qStatus[currentIndex] === 'marked') {
                qStatus[currentIndex] = userAnswers[currentIndex] !== null ? 'answered' : 'visited';
            } else {
                qStatus[currentIndex] = 'marked';
            }
            updatePaletteStyles();
        }

        function submitTest() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            let correct = 0, incorrect = 0, unattempted = 0;
            const reviewCont = document.getElementById('review-container');
            reviewCont.innerHTML = '';

            quizData.forEach((qObj, i) => {
                const uAns = userAnswers[i];
                let isCorr = false;

                if (uAns === null) {
                    unattempted++;
                } else if (uAns === qObj.correct) {
                    correct++;
                    isCorr = true;
                } else {
                    incorrect++;
                }

                let statusHtml = uAns === null ? '<span class="review-status status-unatt">Unattempted</span>' :
                                 isCorr ? '<span class="review-status status-corr">Correct</span>' :
                                          '<span class="review-status status-incorr">Incorrect</span>';

                let uAnsText = uAns === null ? 'None' : qObj.options[uAns];
                let cAnsText = qObj.options[qObj.correct];

                reviewCont.innerHTML += `
                    <div class="review-card">
                        <div class="review-q">Q${i+1}. ${qObj.q}</div>
                        ${statusHtml}
                        <div style="margin-bottom: 5px;"><strong>Your Answer:</strong> ${uAnsText}</div>
                        <div><strong>Correct Answer:</strong> ${cAnsText}</div>
                        <div class="review-explanation"><strong>Explanation:</strong> ${qObj.exp}</div>
                    </div>
                `;
            });

            document.getElementById('res-correct').innerText = correct;
            document.getElementById('res-incorrect').innerText = incorrect;
            document.getElementById('res-unattempted').innerText = unattempted;
        }

        // Start App
        window.onload = initTest;
    </script>
</body>
</html>
