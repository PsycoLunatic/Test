        padding: 0;

    header {

        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
        z-index: 100;
    }
    .header-left h1 { margin: 0; font-size: 1.5rem; }
    .header-left p { margin: 0.2rem 0 0; font-size: 0.9rem; opacity: 0.8; }
    #timer-display {
        font-size: 1.5rem;
        font-weight: bold;
        background: #fff;
        color: var(--primary);
        padding: 0.5rem 1rem;
        border-radius: 4px;
        display: none;
    }
    .container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
    }
    .set-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 2rem;
    }
    .set-btn {
        background-color: white;
        border: 2px solid var(--primary);
        color: var(--primary);
        padding: 1rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        flex: 1;
        min-width: 150px;
        transition: all 0.2s;
    }
    .set-btn:hover, .set-btn.active {
        background-color: var(--primary);
        color: white;
    }
    .quiz-container {
        display: none;
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .question-card {
        margin-bottom: 1.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid #e5e7eb;
    }
    .question-text {
        font-weight: bold;
        font-size: 1.1rem;
        margin-bottom: 1rem;
    }
    .options-grid {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .option-label {
        display: flex;
        align-items: center;
        padding: 0.75rem;
        background: #f9fafb;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.2s;
    }
    .option-label:hover { background: #e5e7eb; }
    .option-label input { margin-right: 1rem; }
    .correct-ans { background-color: #d1fae5 !important; border-color: var(--success) !important; }
    .wrong-ans { background-color: #fee2e2 !important; border-color: var(--danger) !important; }
    .action-btns {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }
    .btn {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        color: white;
        font-size: 1rem;
    }
    .btn-submit { background-color: var(--success); }
    .btn-submit:hover { background-color: #059669; }
    .btn-retry { background-color: var(--secondary); display: none; }
    .btn-retry:hover { background-color: #2563eb; }
    #score-display {
        font-size: 1.25rem;
        font-weight: bold;
        margin-top: 1rem;
        text-align: center;
        color: var(--primary);
        display: none;
        padding: 1rem;
        background: #eff6ff;
        border-radius: 4px;
    }
</style>
</head>

const setButtonsContainer = document.getElementById('set-buttons');
const questionsWrapper = document.getElementById('questions-wrapper');
const timerDisplay = document.getElementById('timer-display');
const submitBtn = document.getElementById('submit-btn');
const retryBtn = document.getElementById('retry-btn');
const backBtn = document.getElementById('back-btn');
const scoreDisplay = document.getElementById('score-display');
const currentSetTitle = document.getElementById('current-set-title');

// Initialize set buttons
quizData.forEach((set, index) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn';
    btn.innerText = set.title;
    btn.onclick = () => loadSet(index);
    setButtonsContainer.appendChild(btn);
});

function loadSet(index) {
    currentSetIndex = index;
    userAnswers = new Array(25).fill(null);
    const set = quizData[index];
    
    currentSetTitle.innerText = set.title;
    questionsWrapper.innerHTML = '';
    
    set.questions.forEach((qObj, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerText = `${qIndex + 1}. ${qObj.q}`;
        card.appendChild(qText);
        
        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';
        optionsGrid.id = `options-grid-${qIndex}`;
        
        qObj.options.forEach((optText, optIndex) => {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.id = `label-${qIndex}-${optIndex}`;
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q${qIndex}`;
            radio.value = optIndex;
            radio.onchange = () => {
                userAnswers[qIndex] = optIndex;
            };
            
            label.appendChild(radio);
            label.appendChild(document.createTextNode(optText));
            optionsGrid.appendChild(label);
        });
        
        card.appendChild(optionsGrid);
        questionsWrapper.appendChild(card);
    });
    
    selectionScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    submitBtn.style.display = 'block';
    retryBtn.style.display = 'none';
    scoreDisplay.style.display = 'none';
    timerDisplay.style.display = 'block';
    
    startTimer();
    window.scrollTo(0, 0);
}

function startTimer() {
    clearInterval(timerInterval);
    timeRemaining = 1500;
    updateTimerUI();
    
    timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerUI();
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            alert("Time's up! Submitting your answers automatically.");
            submitQuiz();
        }
    }, 1000);
}

function updateTimerUI() {
    const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
    const secs = (timeRemaining % 60).toString().padStart(2, '0');
    timerDisplay.innerText = `${mins}:${secs}`;
    if (timeRemaining < 300) {
        timerDisplay.style.color = 'var(--danger)';
    } else {
        timerDisplay.style.color = 'var(--primary)';
    }
}

function submitQuiz() {
    clearInterval(timerInterval);
    let score = 0;
    const set = quizData[currentSetIndex];
    
    // Disable all inputs and highlight answers
    set.questions.forEach((qObj, qIndex) => {
        const correctOpt = qObj.a;
        const selectedOpt = userAnswers[qIndex];
        
        const correctLabel = document.getElementById(`label-${qIndex}-${correctOpt}`);
        if(correctLabel) correctLabel.classList.add('correct-ans');
        
        if (selectedOpt !== null && selectedOpt !== correctOpt) {
            const wrongLabel = document.getElementById(`label-${qIndex}-${selectedOpt}`);
            if(wrongLabel) wrongLabel.classList.add('wrong-ans');
        }
        
        if (selectedOpt === correctOpt) score++;
        
        // Disable radios
        const radios = document.getElementsByName(`q${qIndex}`);
        radios.forEach(r => r.disabled = true);
    });
    
    scoreDisplay.innerText = `Your Score: ${score} / 25 (${((score/25)*100).toFixed(0)}%)`;
    scoreDisplay.style.display = 'block';
    
    submitBtn.style.display = 'none';
    retryBtn.style.display = 'block';
    timerDisplay.style.display = 'none';
    window.scrollTo(0, 0);
}

function retrySet() {
    loadSet(currentSetIndex);
}

function goBack() {
    clearInterval(timerInterval);
    quizScreen.style.display = 'none';
    selectionScreen.style.display = 'block';
    timerDisplay.style.display = 'none';
}
</script>
</body>
</html>
