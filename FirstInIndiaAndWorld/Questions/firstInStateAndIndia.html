<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First in India & World - Revision Portal</title>
<style>
    :root {
        --primary: #1e3a8a;
        --secondary: #2563eb;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --success: #16a34a;
        --success-bg: #dcfce7;
        --danger: #dc2626;
        --danger-bg: #fee2e2;
        --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        line-height: 1.5;
    }

    header {
        background-color: var(--primary);
        color: white;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-left h1 { margin: 0; font-size: 1.4rem; }
    .header-left p { margin: 0.2rem 0 0; font-size: 0.85rem; opacity: 0.85; }

    #timer-display {
        font-size: 1.4rem;
        font-weight: 700;
        background: #ffffff;
        color: var(--primary);
        padding: 0.4rem 1rem;
        border-radius: 6px;
        display: none;
        font-family: monospace;
    }

    .container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
    }

    .set-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.25rem;
        margin-top: 1.5rem;
    }

    .set-card {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .set-card:hover {
        border-color: var(--secondary);
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .set-card h3 { margin: 0 0 0.5rem 0; color: var(--primary); }
    .set-card p { margin: 0; font-size: 0.9rem; color: #64748b; }

    .quiz-container {
        display: none;
        background: var(--card-bg);
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border);
    }

    .question-card {
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
    }

    .question-text {
        font-weight: 600;
        font-size: 1.05rem;
        margin-bottom: 1rem;
    }

    .options-grid {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
    }

    .option-label {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease;
    }

    .option-label:hover { background: #f1f5f9; }
    .option-label input { margin-right: 0.8rem; accent-color: var(--secondary); }

    .correct-ans {
        background-color: var(--success-bg) !important;
        border-color: var(--success) !important;
        color: #14532d;
        font-weight: 600;
    }

    .wrong-ans {
        background-color: var(--danger-bg) !important;
        border-color: var(--danger) !important;
        color: #7f1d1d;
    }

    .action-btns {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
        flex-wrap: wrap;
    }

    .btn {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        color: white;
        font-size: 0.95rem;
        transition: background 0.2s;
    }

    .btn-submit { background-color: var(--success); }
    .btn-submit:hover { background-color: #15803d; }
    .btn-retry { background-color: var(--secondary); display: none; }
    .btn-retry:hover { background-color: #1d4ed8; }
    .btn-back { background-color: #64748b; }
    .btn-back:hover { background-color: #475569; }

    #score-display {
        font-size: 1.25rem;
        font-weight: 700;
        margin-top: 1.5rem;
        text-align: center;
        color: var(--primary);
        display: none;
        padding: 1rem;
        background: #eff6ff;
        border-radius: 6px;
        border: 1px solid #bfdbfe;
    }
</style>
</head>

</div>

            { q: "Who was the first Union Cabinet Minister to resign from Jawaharlal Nehru's Cabinet (1950)?", options: ["Dr. B. R. Ambedkar", "Dr. Syama Prasad Mukherjee", "John Matthai", "C. D. Deshmukh"], a: 1 }
        ]
    },
    {

        desc: "Designed to eliminate common misconceptions, testing official corrections and precise historical details.",
        questions: [
            { q: "Which is the FIRST and ONLY genetically modified (GM) crop approved for commercial cultivation in India?", options: ["Bt Brinjal", "Bt Cotton", "DMH-11 Mustard", "Golden Rice"], a: 1 },
            { q: "What is the correct regulatory status of Bt Brinjal in India?", options: ["Commercially cultivated since 2002", "Placed under a moratorium; not approved for commercial cultivation", "Fully banned permanently by Supreme Court", "Approved only in southern states"], a: 1 },

            { q: "James Augustus Hicky is historically remembered in India for which accurate achievement?", options: ["Introducing the first printing press in India", "Founding Hicky's Bengal Gazette (India's first newspaper)", "Starting the first Hindi daily newspaper", "Establishing the Calcutta GPO"], a: 1 },
            { q: "Which is the accurate historical designation for Razia Sultan?", options: ["First and last woman ruler of ancient India", "First and only woman Sultan of the Delhi Sultanate", "First female governor under Mughal rule", "First female ruler of Bengal"], a: 1 },
            { q: "Who were the first climbers to summit Mount Everest without supplemental oxygen (1978)?", options: ["Tenzing Norgay & Edmund Hillary", "Reinhold Messner & Peter Habeler", "Sherpa Anga Dorjee & Phu Dorjee", "Phu Dorjee & Reinhold Messner"], a: 1 },

            { q: "Who was the first Indian woman to win an INDIVIDUAL GOLD medal at the Asian Games (1970 400m)?", options: ["Shanti Soundarajan", "Kamaljeet Sandhu", "P. T. Usha", "Navjot Kaur"], a: 1 },

            { q: "In which year was India's first nuclear reactor, Apsara, commissioned/operationalized?", options: ["1948", "1956", "1974", "1984"], a: 1 },
            { q: "Who led India's first scientific expedition to Antarctica (January 1982)?", options: ["Lt. Ram Charan", "Dr. S. Z. Qasim", "Dr. K. Kasturirangan", "Dr. A. P. J. Abdul Kalam"], a: 1 },
            { q: "Which English merchant explorer undertook extensive travels across India between 1583 and 1591?", options: ["Thomas Stephens", "Ralph Fitch", "John Mildenhall", "William Hawkins"], a: 1 },
            { q: "Shanti Tigga holds which distinction in military history?", options: ["First woman officer in Indian Navy", "First female jawan in the Indian Army", "First woman fighter pilot", "First female Sword of Honour recipient"], a: 1 },
            { q: "C. V. Raman was awarded the Nobel Prize in Physics (1930) specifically for his work on:", options: ["Thermal ionization", "Scattering of light", "Structure of atoms", "Cosmic radiation"], a: 1 },
            { q: "Dr. B. R. Ambedkar Open University, India's first open university, was established in 1982 in which state/city?", options: ["New Delhi", "Hyderabad (Andhra Pradesh/Telangana)", "Kolkata", "Mumbai"], a: 1 },
            { q: "Who was the first woman Chief Justice of a High Court in India (Himachal Pradesh HC, 1991)?", options: ["Justice Anna Chandy", "Justice Leila Seth", "Justice M. Fathima Beevi", "Justice Ruma Pal"], a: 1 },
            { q: "Who was the first woman President of the UN General Assembly during its 8th session in 1953?", options: ["Eleanor Roosevelt", "Vijaya Lakshmi Pandit", "Sarojini Naidu", "Hansa Mehta"], a: 1 }
        ]
    }
];

let currentSetIndex = -1;
let userAnswers = [];
let timerInterval;
let timeRemaining = 1500;

const selectionScreen = document.getElementById('selection-screen');
const quizScreen = document.getElementById('quiz-screen');
const setCardsContainer = document.getElementById('set-cards');
const questionsWrapper = document.getElementById('questions-wrapper');
const timerDisplay = document.getElementById('timer-display');
const submitBtn = document.getElementById('submit-btn');
const retryBtn = document.getElementById('retry-btn');
const scoreDisplay = document.getElementById('score-display');
const currentSetTitle = document.getElementById('current-set-title');

quizData.forEach((set, index) => {
    const card = document.createElement('div');
    card.className = 'set-card';
    card.onclick = () => loadSet(index);
    card.innerHTML = `
        <div>
            <h3>${set.title}</h3>
            <p>${set.desc}</p>
        </div>
        <div style="margin-top: 1rem; font-weight: 600; color: var(--secondary); font-size: 0.85rem;">
            25 Questions • 25 Mins →
        </div>
    `;
    setCardsContainer.appendChild(card);
});

function loadSet(index) {
    currentSetIndex = index;
    userAnswers = new Array(25).fill(null);
    const set = quizData[index];
    
    currentSetTitle.innerText = set.title;
    questionsWrapper.innerHTML = '';
    
    set.questions.forEach((qObj, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerText = `${qIndex + 1}. ${qObj.q}`;
        card.appendChild(qText);
        
        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';
        
        qObj.options.forEach((optText, optIndex) => {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.id = `label-${qIndex}-${optIndex}`;
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q${qIndex}`;
            radio.value = optIndex;
            radio.onchange = () => { userAnswers[qIndex] = optIndex; };
            
            label.appendChild(radio);
            label.appendChild(document.createTextNode(optText));
            optionsGrid.appendChild(label);
        });
        
        card.appendChild(optionsGrid);
        questionsWrapper.appendChild(card);
    });
    
    selectionScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    submitBtn.style.display = 'inline-block';
    retryBtn.style.display = 'none';
    scoreDisplay.style.display = 'none';
    timerDisplay.style.display = 'block';
    
    startTimer();
    window.scrollTo(0, 0);
}

function startTimer() {
    clearInterval(timerInterval);
    timeRemaining = 1500;
    updateTimerUI();
    
    timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerUI();
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            alert("Time limit reached! Submitting your answers automatically.");
            submitQuiz();
        }
    }, 1000);
}

function updateTimerUI() {
    const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
    const secs = (timeRemaining % 60).toString().padStart(2, '0');
    timerDisplay.innerText = `${mins}:${secs}`;
    timerDisplay.style.color = timeRemaining < 300 ? 'var(--danger)' : 'var(--primary)';
}

function submitQuiz() {
    clearInterval(timerInterval);
    let score = 0;
    const set = quizData[currentSetIndex];
    
    set.questions.forEach((qObj, qIndex) => {
        const correctOpt = qObj.a;
        const selectedOpt = userAnswers[qIndex];
        
        const correctLabel = document.getElementById(`label-${qIndex}-${correctOpt}`);
        if (correctLabel) correctLabel.classList.add('correct-ans');
        
        if (selectedOpt !== null && selectedOpt !== correctOpt) {
            const wrongLabel = document.getElementById(`label-${qIndex}-${selectedOpt}`);
            if (wrongLabel) wrongLabel.classList.add('wrong-ans');
        }
        
        if (selectedOpt === correctOpt) score++;
        
        const radios = document.getElementsByName(`q${qIndex}`);
        radios.forEach(r => r.disabled = true);
    });
    
    scoreDisplay.innerText = `Final Score: ${score} / 25 (${((score / 25) * 100).toFixed(0)}%)`;
    scoreDisplay.style.display = 'block';
    
    submitBtn.style.display = 'none';
    retryBtn.style.display = 'inline-block';
    timerDisplay.style.display = 'none';
    window.scrollTo(0, 0);
}

function retrySet() {
    loadSet(currentSetIndex);
}

function goBack() {
    clearInterval(timerInterval);
    quizScreen.style.display = 'none';
    selectionScreen.style.display = 'block';
    timerDisplay.style.display = 'none';
}
</script>
</body>
</html>
